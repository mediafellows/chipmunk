name: Javascript CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.1, 24.20.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - run: make test build
      - run: yarn test:http
      - run: yarn test:package
      - run: make audit
        if: matrix.node == '22.23.1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: node-${{ matrix.node }}-results
          include-hidden-files: true
          path: |
            coverage/
            .artifacts/*.json
            .artifacts/*.xml
            .artifacts/*.tgz

  browsers:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - run: yarn test:integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-results
          include-hidden-files: true
          path: |
            test-results/
            .artifacts/browser-results.json
